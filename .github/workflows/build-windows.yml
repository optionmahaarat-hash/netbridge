# Builds the Windows installers on a GitHub machine (nothing to install on your PC).
# Run: GitHub -> Actions -> build-windows -> Run workflow (choose the branch).  Setup files are in the run's "Artifacts":
#   NetBridge-Setup-<version>.exe       the full program
#   NetBridgeLite-Setup-<version>.exe   the Lite (family) program
# The Lite build made here has no update-signing key (its built-in updater stays off); use build_installer.bat on your PC for signed releases.
name: build-windows
on: { workflow_dispatch: {} }
jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m pytest -q tests
        continue-on-error: true
      - name: Xray core
        run: python get_xray.py
      - name: Build full program
        run: python -m PyInstaller --noconfirm --clean NetBridge.spec
      - name: Build Lite program
        run: python -m PyInstaller --noconfirm --clean NetBridgeLite.spec
      - name: Add cores
        shell: pwsh
        run: |
          Copy-Item cores dist\NetBridge\cores -Recurse
          Copy-Item cores dist\NetBridgeLite\cores -Recurse
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }
          $v  = python -c "from app.version import VERSION as v; print(v)"
          $lv = python -c "from app.lite.version import LITE_VERSION as v; print(v)"
          & $iscc "/DAppVersion=$v" installer\NetBridge.iss
          & $iscc "/DAppVersion=$lv" installer\NetBridgeLite.iss
      - uses: actions/upload-artifact@v4
        with:
          name: NetBridge-Windows-Setup
          path: release/*.exe
